name: Build Android APK

on:
  push:
    paths:
      - 'android-project.zip.b64'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project source
        run: |
          base64 --decode android-project.zip.b64 > /tmp/android-project.zip
          unzip -oq /tmp/android-project.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Source checks
        run: sh scripts/check-source.sh
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android/RepostCleaner :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: repost-cleaner-debug-apk
          path: android/RepostCleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
