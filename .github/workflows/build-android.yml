name: Build Android APK

on:
  push:
    paths:
      - '.build/source-v1-*.b64'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore merged project source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/RepostCleaner/app/src/main/java/com/repostcleaner/app/MainActivity.kt ]; then
            cat .build/source-v1-*.b64 | base64 --decode > /tmp/repost-cleaner-source.tar.gz
            tar -tzf /tmp/repost-cleaner-source.tar.gz >/dev/null
            tar -xzf /tmp/repost-cleaner-source.tar.gz
          fi
          test -f android/RepostCleaner/app/src/main/java/com/repostcleaner/app/MainActivity.kt
          test -f android/RepostCleaner/app/src/main/assets/cleaner.js
          test -f chrome-extension/content.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate merged sources
        run: sh scripts/check-source.sh

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android/RepostCleaner :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repost-cleaner-v1.0.0-debug-apk
          path: android/RepostCleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
