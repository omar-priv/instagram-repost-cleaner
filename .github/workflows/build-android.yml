name: Build Android APK

on:
  push:
    paths:
      - '.build/source-*.b64'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore Android project source
        run: |
          cat .build/source-*.b64 | base64 --decode | tar -xz
          test -f android/RepostCleaner/app/src/main/java/com/repostcleaner/app/MainActivity.kt
          test -f android/RepostCleaner/app/src/main/assets/cleaner.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check JavaScript syntax and source safety
        run: |
          node --check android/RepostCleaner/app/src/main/assets/cleaner.js
          if grep -nE 'fetch\\(|XMLHttpRequest|sendBeacon|document\\.cookie|chrome\\.cookies|localStorage\\.setItem|sessionStorage\\.setItem' android/RepostCleaner/app/src/main/assets/cleaner.js; then
            echo "Potential network or credential-storage API found; inspect before building."
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android/RepostCleaner :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repost-cleaner-debug-apk
          path: android/RepostCleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
