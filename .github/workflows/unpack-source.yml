name: Restore source for repair
on:
  push:
    paths:
      - '.github/workflows/unpack-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/android-source-inspection
          fetch-depth: 0
      - name: Restore project source
        shell: bash
        run: |
          set -euo pipefail
          cat .build/source-v1-*.b64 | base64 --decode > /tmp/source.tar.gz
          tar -tzf /tmp/source.tar.gz >/dev/null
          tar -xzf /tmp/source.tar.gz
          test -f android/RepostCleaner/app/src/main/java/com/repostcleaner/app/MainActivity.kt
          test -f android/RepostCleaner/app/src/main/assets/cleaner.js
          git status --short
      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android chrome-extension scripts README-AR.md REVIEW-2.1.0-AR.md
          if git diff --cached --quiet; then
            echo "No extracted source changes."
            exit 0
          fi
          git commit -m "Restore source files for Android repair"
          git push origin HEAD:repair/android-source-inspection
